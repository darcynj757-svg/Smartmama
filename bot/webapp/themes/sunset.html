<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закат</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(155deg, #ffecd2 0%, #fcb69f 25%, #ffeaa7 55%, #ffd6a5 75%, #ffb347 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.phone {
  width: 390px;
  min-height: 780px;
  background: transparent;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.header {
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.55);
  padding: 14px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 6px; }
.logo-text { font-family: 'Comfortaa', cursive; font-weight: 700; font-size: 18px; }
.logo-text .accent { color: #d4601a; }
.logo-text .main { color: #3a2010; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #f0a060, #e07030); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px 20px;
  gap: 8px;
}
.baby-emoji { font-size: 64px; filter: drop-shadow(0 4px 12px rgba(212,96,26,0.3)); }
.baby-name { font-size: 13px; color: rgba(58,32,16,0.45); font-weight: 600; letter-spacing: 1px; }
.baby-label { font-size: 22px; font-weight: 800; color: #3a2010; }
.card {
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 24px 24px 0 0;
  flex: 1;
  padding: 20px;
  border-top: 1px solid rgba(255,255,255,0.75);
}
.section-label { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: rgba(58,32,16,0.40); text-transform: uppercase; margin-bottom: 12px; }
.tiles { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.tile {
  flex: 0 0 calc(16.66% - 10px);
  min-width: 60px;
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  border: 2px solid rgba(255,255,255,0.6);
  box-shadow: 0 3px 10px rgba(212,96,26,0.15);
}
.tile-bg { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: flex-end; justify-content: center; font-size: 9px; font-weight: 700; color: white; padding: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
.tile-1 { background: linear-gradient(135deg, #f08040, #e06020); }
.tile-2 { background: linear-gradient(135deg, #f0a840, #e08820); }
.tile-3 { background: linear-gradient(135deg, #f0c848, #e0a028); }
.tile-4 { background: linear-gradient(135deg, #f08870, #e06850); }
.tile-5 { background: linear-gradient(135deg, #e86840, #d04820); }
.tile-6 { background: linear-gradient(135deg, #f0b060, #e09040); }
.trackers { display: flex; gap: 12px; margin-bottom: 20px; }
.tracker {
  flex: 1;
  background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,220,180,0.6));
  border-radius: 16px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.8);
  box-shadow: 0 2px 12px rgba(212,96,26,0.08);
}
.tracker-emoji { font-size: 22px; margin-bottom: 4px; }
.tracker-name { font-size: 11px; font-weight: 700; color: rgba(58,32,16,0.50); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 2px; }
.tracker-val { font-size: 20px; font-weight: 800; color: #3a2010; }
.tracker-sub { font-size: 10px; color: rgba(58,32,16,0.40); font-weight: 600; }
.chat-btn {
  background: linear-gradient(135deg, #d4601a, #b04010);
  color: white;
  border-radius: 16px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(212,96,26,0.45);
}
.chat-icon { font-size: 22px; }
.chat-text { font-weight: 700; font-size: 14px; }
.chat-arrow { margin-left: auto; font-size: 18px; opacity: 0.7; }
.nav {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.6);
  padding: 10px 0 6px;
  display: flex;
  justify-content: space-around;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; color: rgba(58,32,16,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
.nav-item.active { color: #d4601a; }
.nav-icon { font-size: 20px; }
.label-badge {
  display: inline-block;
  background: linear-gradient(135deg, #f0a060, #d4601a);
  color: white;
  font-size: 9px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="logo">
      <span style="font-size:18px">🌅</span>
      <span class="logo-text"><span class="accent">Смарт</span> <span class="main">Мама</span></span>
    </div>
    <div class="avatar">👩</div>
  </div>
  <div class="hero">
    <div class="baby-emoji">👶</div>
    <div class="baby-name">добавьте фото малыша</div>
    <div class="baby-label">малыш</div>
  </div>
  <div class="card">
    <div class="label-badge">🌅 Закат</div>
    <div class="section-label">Чем поможем сегодня?</div>
    <div class="tiles">
      <div class="tile"><div class="tile-bg tile-1">Речь</div></div>
      <div class="tile"><div class="tile-bg tile-2">Игры</div></div>
      <div class="tile"><div class="tile-bg tile-3">Здоровье</div></div>
      <div class="tile"><div class="tile-bg tile-4">Рецепты</div></div>
      <div class="tile"><div class="tile-bg tile-5">Советы</div></div>
      <div class="tile"><div class="tile-bg tile-6">Развитие</div></div>
    </div>
    <div class="section-label">Трекеры</div>
    <div class="trackers">
      <div class="tracker">
        <div class="tracker-emoji">😴</div>
        <div class="tracker-name">Сон</div>
        <div class="tracker-val">8.5 ч</div>
        <div class="tracker-sub">норма 10–14 ч</div>
      </div>
      <div class="tracker">
        <div class="tracker-emoji">🍼</div>
        <div class="tracker-name">Питание</div>
        <div class="tracker-val">6 раз</div>
        <div class="tracker-sub">норма 6–8 р/д</div>
      </div>
    </div>
    <div class="chat-btn">
      <div class="chat-icon">💬</div>
      <div class="chat-text">AI Smart Mama</div>
      <div class="chat-arrow">›</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-item active"><div class="nav-icon">🏠</div>Главная</div>
    <div class="nav-item"><div class="nav-icon">📅</div>Дневник</div>
    <div class="nav-item"><div class="nav-icon">📸</div>Нейрофото</div>
    <div class="nav-item"><div class="nav-icon">⚙️</div>Настройки</div>
  </div>
</div>
</body>
</html>
