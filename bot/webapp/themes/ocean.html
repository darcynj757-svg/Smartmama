<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Морской</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(155deg, #0d2a4a 0%, #1a3f6a 30%, #0e4870 60%, #1a6080 85%, #0a3a5a 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.phone {
  width: 390px;
  min-height: 780px;
  background: transparent;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.header {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  padding: 14px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 6px; }
.logo-text { font-family: 'Comfortaa', cursive; font-weight: 700; font-size: 18px; }
.logo-text .accent { color: #60c8f0; }
.logo-text .main { color: #e8f4fc; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #3a8ab8, #1a6090); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 30px 20px 20px;
  gap: 8px;
}
.baby-emoji { font-size: 64px; filter: drop-shadow(0 4px 16px rgba(96,200,240,0.4)); }
.baby-name { font-size: 13px; color: rgba(232,244,252,0.45); font-weight: 600; letter-spacing: 1px; }
.baby-label { font-size: 22px; font-weight: 800; color: #e8f4fc; }
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 24px 24px 0 0;
  flex: 1;
  padding: 20px;
  border-top: 1px solid rgba(255,255,255,0.15);
}
.section-label { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: rgba(232,244,252,0.40); text-transform: uppercase; margin-bottom: 12px; }
.tiles { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.tile {
  flex: 0 0 calc(16.66% - 10px);
  min-width: 60px;
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 3px 12px rgba(0,0,0,0.3);
}
.tile-bg { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: flex-end; justify-content: center; font-size: 9px; font-weight: 700; color: white; padding: 4px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
.tile-1 { background: linear-gradient(135deg, #2880b8, #1060a0); }
.tile-2 { background: linear-gradient(135deg, #38a8d0, #1880b0); }
.tile-3 { background: linear-gradient(135deg, #28c8e0, #10a0c0); }
.tile-4 { background: linear-gradient(135deg, #50c8a0, #28a880); }
.tile-5 { background: linear-gradient(135deg, #7090d0, #5070b8); }
.tile-6 { background: linear-gradient(135deg, #3090c0, #1870a0); }
.trackers { display: flex; gap: 12px; margin-bottom: 20px; }
.tracker {
  flex: 1;
  background: rgba(255,255,255,0.10);
  border-radius: 16px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.tracker-emoji { font-size: 22px; margin-bottom: 4px; }
.tracker-name { font-size: 11px; font-weight: 700; color: rgba(232,244,252,0.45); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 2px; }
.tracker-val { font-size: 20px; font-weight: 800; color: #e8f4fc; }
.tracker-sub { font-size: 10px; color: rgba(232,244,252,0.35); font-weight: 600; }
.chat-btn {
  background: linear-gradient(135deg, #1a80c0, #0a60a0);
  color: white;
  border-radius: 16px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 24px rgba(26,128,192,0.50);
  border: 1px solid rgba(255,255,255,0.2);
}
.chat-icon { font-size: 22px; }
.chat-text { font-weight: 700; font-size: 14px; }
.chat-arrow { margin-left: auto; font-size: 18px; opacity: 0.7; }
.nav {
  background: rgba(0,0,0,0.30);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.12);
  padding: 10px 0 6px;
  display: flex;
  justify-content: space-around;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; font-weight: 700; color: rgba(232,244,252,0.30); text-transform: uppercase; letter-spacing: 0.5px; }
.nav-item.active { color: #60c8f0; }
.nav-icon { font-size: 20px; }
.label-badge {
  display: inline-block;
  background: linear-gradient(135deg, #3a8ab8, #1a6090);
  color: white;
  font-size: 9px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid rgba(255,255,255,0.2);
}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="logo">
      <span style="font-size:18px">🌊</span>
      <span class="logo-text"><span class="accent">Смарт</span> <span class="main">Мама</span></span>
    </div>
    <div class="avatar">👩</div>
  </div>
  <div class="hero">
    <div class="baby-emoji">👶</div>
    <div class="baby-name">добавьте фото малыша</div>
    <div class="baby-label">малыш</div>
  </div>
  <div class="card">
    <div class="label-badge">🌊 Морской</div>
    <div class="section-label">Чем поможем сегодня?</div>
    <div class="tiles">
      <div class="tile"><div class="tile-bg tile-1">Речь</div></div>
      <div class="tile"><div class="tile-bg tile-2">Игры</div></div>
      <div class="tile"><div class="tile-bg tile-3">Здоровье</div></div>
      <div class="tile"><div class="tile-bg tile-4">Рецепты</div></div>
      <div class="tile"><div class="tile-bg tile-5">Советы</div></div>
      <div class="tile"><div class="tile-bg tile-6">Развитие</div></div>
    </div>
    <div class="section-label">Трекеры</div>
    <div class="trackers">
      <div class="tracker">
        <div class="tracker-emoji">😴</div>
        <div class="tracker-name">Сон</div>
        <div class="tracker-val">8.5 ч</div>
        <div class="tracker-sub">норма 10–14 ч</div>
      </div>
      <div class="tracker">
        <div class="tracker-emoji">🍼</div>
        <div class="tracker-name">Питание</div>
        <div class="tracker-val">6 раз</div>
        <div class="tracker-sub">норма 6–8 р/д</div>
      </div>
    </div>
    <div class="chat-btn">
      <div class="chat-icon">💬</div>
      <div class="chat-text">AI Smart Mama</div>
      <div class="chat-arrow">›</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-item active"><div class="nav-icon">🏠</div>Главная</div>
    <div class="nav-item"><div class="nav-icon">📅</div>Дневник</div>
    <div class="nav-item"><div class="nav-icon">📸</div>Нейрофото</div>
    <div class="nav-item"><div class="nav-icon">⚙️</div>Настройки</div>
  </div>
</div>
</body>
</html>
