services:
  - type: web
    name: smartmama
    runtime: node
    buildCommand: npm install -g pnpm@10 && pnpm install && pnpm --filter @workspace/api-server run build && pip3 install -r bot/requirements.txt
    startCommand: bash scripts/render-start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: ADMIN_USER_ID
        value: "288113313"
      - key: RENDER
        value: "true"
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
    disk:
      name: smartmama-data
      mountPath: /data
      sizeGB: 1
